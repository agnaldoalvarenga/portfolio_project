  html{scroll-behavior:smooth}

  a{color:inherit}
  ::selection{background:rgba(212,175,55,.28); color:#fff}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px; border-radius:4px}

  /* ---------- Nav ---------- */
  nav{position:sticky; top:0; z-index:20;
    backdrop-filter:blur(10px); background:rgba(14,11,9,.72);
    border-bottom:1px solid var(--line)}
  .nav-inner{display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; max-width:var(--maxw); margin:0 auto}
  .brand{display:flex; flex-direction:column; line-height:1}
  .brand b{font-family:var(--serif); font-weight:600; letter-spacing:.34em;
    font-size:15px; color:var(--ink)}
  .brand span{font-size:9.5px; letter-spacing:.42em; text-transform:uppercase;
    color:var(--gold); margin-top:6px}
  .lang{display:flex; gap:2px; align-items:center}
  .lang button{
    font:inherit; font-size:12.5px; letter-spacing:.18em; font-weight:600;
    background:none; border:0; color:var(--ink-faint); cursor:pointer;
    padding:8px 10px 12px; position:relative; text-transform:uppercase}
  .lang button:hover{color:var(--ink-soft)}
  .lang .sep{color:var(--ink-faint); opacity:.4; pointer-events:none; padding:0 1px}
  .lang button[aria-pressed="true"]{color:var(--gold)}
  .lang button[aria-pressed="true"]::after{
    content:""; position:absolute; left:50%; bottom:2px; width:5px; height:5px;
    transform:translateX(-50%); border-radius:50%; background:var(--teal);
    box-shadow:0 0 0 0 rgba(29,158,117,.6); animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(29,158,117,.55)}
    70%{box-shadow:0 0 0 7px rgba(29,158,117,0)}100%{box-shadow:0 0 0 0 rgba(29,158,117,0)}}

  /* ---------- Manifesto / Hero ---------- */
  header.hero{padding:96px 0 76px; text-align:center; position:relative}
  .eyebrow{font-size:11px; letter-spacing:.44em; text-transform:uppercase;
    color:var(--gold); display:inline-flex; align-items:center; gap:12px}
  .eyebrow::before,.eyebrow::after{content:""; width:34px; height:1px;
    background:linear-gradient(90deg,transparent,var(--gold-soft))}
  .eyebrow::after{background:linear-gradient(90deg,var(--gold-soft),transparent)}
  .slogan{font-family:var(--serif); font-weight:500;
    font-size:clamp(30px,5.4vw,60px); line-height:1.16; letter-spacing:.005em;
    margin:30px auto 8px; max-width:16ch; text-wrap:balance;
    color:var(--ink)}
  .slogan .accent{color:var(--gold-soft); font-style:italic}
  .live{display:inline-flex; align-items:center; gap:9px; margin-top:14px;
    font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:var(--ink-faint)}
  .live .dot{width:7px; height:7px; border-radius:50%; background:var(--teal);
    box-shadow:0 0 10px rgba(29,158,117,.9); animation:pulse 2.4s infinite}
  .lede{max-width:60ch; margin:26px auto 0; color:var(--ink-soft); font-size:18px}
  .cta-row{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:38px}
  .btn{font:inherit; font-weight:600; font-size:15px; letter-spacing:.01em;
    padding:15px 26px; border-radius:2px; cursor:pointer; border:1px solid transparent;
    text-decoration:none; display:inline-flex; align-items:center; gap:10px; transition:.2s}
  .btn-gold{background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    color:#241a05; border-color:var(--gold)}
  .btn-gold:hover{transform:translateY(-2px); box-shadow:0 12px 30px -12px rgba(212,175,55,.55)}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--line-strong)}
  .btn-ghost:hover{border-color:var(--gold); color:var(--gold-soft)}

  /* ---------- Sections ---------- */

  .sec-kicker{font-family:var(--serif); font-size:12px; letter-spacing:.4em;
    text-transform:uppercase; color:var(--gold)}
  .sec-title{font-family:var(--serif); font-size:clamp(24px,3.2vw,34px); font-weight:500;
    margin:0; color:var(--ink); text-wrap:balance}
  .sec-sub{color:var(--ink-soft); max-width:62ch; margin:0}

    background:var(--line); border:1px solid var(--line); border-radius:3px; overflow:hidden}
  .vcell{background:var(--ground-2); padding:26px 24px; transition:.25s; position:relative}

    background:var(--teal); transition:width .3s}

  /* Moat comparison */

  .moat-row{display:grid; grid-template-columns:1fr auto 1.15fr; gap:20px; align-items:center;
    background:var(--ground-2); border:1px solid var(--line); border-radius:3px; padding:22px 24px}
  .moat .them{color:var(--ink-soft)}

  .moat .arrow{color:var(--gold); font-size:20px}
  .moat .us{color:var(--ink)}

    text-transform:uppercase; margin-bottom:6px; font-weight:700}
  .moat .us span{font-family:var(--serif); font-size:17px}

  .card{background:var(--ground-2); border:1px solid var(--line); border-radius:4px;
    padding:30px 26px; display:flex; flex-direction:column; transition:.25s}
  .card:hover{border-color:var(--line-strong); transform:translateY(-3px)}
  .card.feature{border-color:var(--gold); background:linear-gradient(180deg,rgba(212,175,55,.06),var(--ground-2))}
  .card .tier{font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold)}
  .card .badge{float:right; font-size:9.5px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--teal); border:1px solid rgba(29,158,117,.4); border-radius:20px; padding:3px 9px}
  .card .price{font-family:var(--serif); font-size:36px; margin:14px 0 2px;
    font-variant-numeric:tabular-nums; color:var(--ink)}
  .card .price small{font-size:15px; color:var(--ink-faint); font-family:var(--sans)}
  .card ul{list-style:none; padding:0; margin:20px 0 26px; display:flex; flex-direction:column; gap:12px}
  .card li{font-size:14.5px; color:var(--ink-soft); padding-left:22px; position:relative}
  .card li::before{content:""; position:absolute; left:0; top:9px; width:9px; height:9px;

  .card .btn{margin-top:auto; justify-content:center}

    radial-gradient(700px 300px at 50% 0%, rgba(139,26,26,.2), transparent 70%);}
  .band h2{font-family:var(--serif); font-weight:500; font-size:clamp(26px,4vw,42px);

  .band p{color:var(--ink-soft); max-width:56ch; margin:0 auto 30px}

  .foot-inner{display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; align-items:center}
  .foot-inner b{font-family:var(--serif); letter-spacing:.3em; color:var(--ink-soft); font-weight:500}

    .moat-row{grid-template-columns:1fr; gap:12px; text-align:left}
    .moat .arrow{transform:rotate(90deg); justify-self:start}

  }
  @media (prefers-reduced-motion:reduce){

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

function setCookie(l){ try{ document.cookie = "NEXT_LOCALE="+l+"; path=/; max-age=31536000; samesite=lax"; }catch(e){} }
function readCookie(){ const m=document.cookie.match(/(?:^|;\s*)NEXT_LOCALE=([^;]+)/); return m?m[1]:null; }

function render(lang){
  const d = DICT[lang] || DICT["pt-BR"];
  document.documentElement.lang = lang;
  $$("[data-i18n]").forEach(el=>{ const k=el.dataset.i18n; if(d[k]!=null) el.textContent = d[k]; });
  $$("[data-i18n-html]").forEach(el=>{ const k=el.dataset.i18nHtml; if(d[k]!=null) el.innerHTML = d[k]; });

  // vectors
  $("#vgrid").innerHTML = d.vectors.map((v,i)=>`
    <div class="vcell"><div class="num">V${i+1}</div><h3>${v[0]}</h3><p>${v[1]}</p></div>`).join("");
  // moat
  $("#moat").innerHTML = d.moat.map(m=>`
    <div class="moat-row">
      <div class="them"><b>${lang==="en"?"They":lang==="es"?"Ellos":"Eles"}</b>${m[0]}</div>
      <div class="arrow">➔</div>
      <div class="us"><b>Ostentaculus</b><span>${m[1]}</span></div>
    </div>`).join("");
  // cards
  $("#cards").innerHTML = d.cards.map((c,i)=>`
    <div class="card${i===1?" feature":""}">
      <div class="tier">${c[3]?`<span class="badge">${c[3]}</span>`:""}${c[0]}</div>
      <div class="price">${c[1]}<small>${c[2]}</small></div>
      <ul>${c[4].map(li=>`<li>${li}</li>`).join("")}</ul>
      <a class="btn ${i===1?"btn-gold":"btn-ghost"}" href="#contact">${d.ctaPrimary.replace(" ➔","")} ➔</a>
    </div>`).join("");

  // toggle state
  $$(".lang button").forEach(b=> b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
}

function detect(){
  const c = readCookie(); if(c && DICT[c]) return c;
  const langs = navigator.languages || [navigator.language || "pt-BR"];
  for(const l of langs){
    const t = l.toLowerCase();
    if(t.startsWith("pt")) return "pt-BR";
    if(t.startsWith("es")) return "es";
    if(t.startsWith("en")) return "en";
  }
  return "pt-BR";
}
